/* Velvet Cafe & Grill — luxury burgundy, antique gold and warm cream identity */

let state = {
  view: 'dashboard', // dashboard | customer | pos | kitchen | owner | tables | menu | orders | settings
  tableNo: 1,
  category: 'All',
  cart: {},
  checkoutOpen: false,
  guestName: '',
  guestPhone: '',
  guestMethod: 'cash',
  guestNote: '',
  sentOrder: null,
  orders: JSON.parse(JSON.stringify(INITIAL_ORDERS))
};

try {
  const saved = localStorage.getItem('velvet_standalone_orders_v1');
  if (saved) state.orders = JSON.parse(saved);
} catch(e) {}

function saveOrders() {
  try { localStorage.setItem('velvet_standalone_orders_v1', JSON.stringify(state.orders)); } catch(e) {}
}

function fmtPKR(n) {
  return Number(n || 0).toLocaleString('en-PK');
}

function setView(v, tNo) {
  state.view = v;
  if (tNo) state.tableNo = tNo;
  if (v !== 'customer') state.sentOrder = null;
  render();
  window.scrollTo(0, 0);
}

function changeQty(id, delta) {
  const next = Math.max(0, (state.cart[id] || 0) + delta);
  if (next === 0) delete state.cart[id];
  else state.cart[id] = next;
  render();
}

function submitCustomerOrder() {
  const items = MENU_ITEMS.filter(p => state.cart[p.id]).map(p => ({
    name: p.name, qty: state.cart[p.id], price: p.price
  }));
  if (!items.length) return;
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  const id = 'VC-' + String(Date.now()).slice(-6);
  const newOrder = {
    id,
    table: state.tableNo,
    customer: state.guestName.trim() || 'Table Guest',
    phone: state.guestPhone.trim(),
    method: state.guestMethod,
    payment: state.guestMethod === 'cash' ? 'Cash' : 'Online',
    paymentStatus: state.guestMethod === 'cash' ? 'Pending' : 'Awaiting verification',
    status: 'New',
    note: state.guestNote.trim(),
    total,
    createdAt: new Date().toISOString(),
    items
  };
  state.orders.unshift(newOrder);
  saveOrders();
  state.cart = {};
  state.checkoutOpen = false;
  state.sentOrder = newOrder;
  render();
}

function updateOrderStatus(id, status) {
  state.orders = state.orders.map(o => o.id === id ? { ...o, status } : o);
  saveOrders();
  render();
}

function markOrderPaid(id) {
  state.orders = state.orders.map(o => o.id === id ? { ...o, paymentStatus: 'Paid' } : o);
  saveOrders();
  render();
}

function advanceOrder(id) {
  const map = { New: 'Preparing', Accepted: 'Preparing', Preparing: 'Ready', Ready: 'Served', Served: 'Completed', Completed: 'Completed' };
  const target = state.orders.find(o => o.id === id);
  if (!target) return;
  updateOrderStatus(id, map[target.status] || 'Served');
}

              </div>
            </article>
            <article class="panel quick-panel">
              <div class="panel-heading"><div><h3>Quick actions</h3><p>Jump to any live station</p></div></div>
              <div class="quick-list">
                <button onclick="setView('customer', 1)"><span class="quick-icon mint">＋</span><span><b>Customer Table Menu</b><small>Place a live order from Table 01</small></span><span>→</span></button>
                <button onclick="setView('pos')"><span class="quick-icon lavender">💳</span><span><b>Cashier POS Terminal</b><small>Verify payments & print receipts</small></span><span>→</span></button>
                <button onclick="setView('kitchen')"><span class="quick-icon peach">🍳</span><span><b>Kitchen Display Queue</b><small>Accept, prepare & serve orders</small></span><span>→</span></button>
              </div>
            </article>
          </section>
          <section class="panel orders-panel">
            <div class="panel-heading"><div><h3>Recent orders <span class="count-badge">${state.orders.length}</span></h3><p>Click any status pill to advance the order live</p></div><button class="button secondary small" onclick="setView('orders')">All orders →</button></div>
            <div class="table-wrap"><table><thead><tr><th>ORDER ID</th><th>TABLE</th><th>ORDER DETAILS</th><th>AMOUNT</th><th>PAYMENT</th><th>STATUS</th><th></th></tr></thead><tbody>${renderOrderRows()}</tbody></table></div>
          </section>
        </div>
      </main>
    </div>
  `;
}

function renderCustomer() {
  if (state.sentOrder) {
    const o = state.sentOrder;
    return `
      <main class="customer-page" style="display:grid;place-items:center;padding:24px">
        <section class="panel" style="max-width:460px;text-align:center;padding:35px">
          <div style="font-size:44px;color:#6c1438">✓</div>
          <h1>Order received!</h1>
          <p>Your order <b>${o.id}</b> has been sent live to Cashier POS & Kitchen.</p>
          <p>Table ${String(o.table).padStart(2,'0')} · <b>Rs. ${fmtPKR(o.total)}</b></p>
          <button class="button primary full" onclick="state.sentOrder=null;render()">Place another order</button>
          <button class="button secondary full" onclick="setView('pos')">See it live in Cashier POS →</button>
          <button class="button secondary full" onclick="setView('kitchen')">See it live in Kitchen Display →</button>
        </section>
      </main>
    `;
  }

  const cats = ['All','Burgers','Mains','Sides','Drinks'];
  const items = MENU_ITEMS.filter(p => state.category === 'All' || p.category === state.category);
  const count = Object.values(state.cart).reduce((a,b) => a+b, 0);
  const total = MENU_ITEMS.reduce((s,p) => s + p.price * (state.cart[p.id] || 0), 0);

  return `
    <main class="customer-page">
      <header class="customer-header">
        <div class="customer-brand"><span>V</span><div><b>velvet</b><small>CAFE & GRILL</small></div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <select class="table-select-pill" onchange="state.tableNo=Number(this.value);render()">
            ${Array.from({length:15}, (_,i) => `<option value="${i+1}" ${state.tableNo===i+1?'selected':''}>TABLE ${String(i+1).padStart(2,'0')}</option>`).join('')}
          </select>
        </div>
      </header>
      <section class="customer-hero">
        <span>MADE FRESH. SERVED WITH LOVE.</span>
        <h1>Good food, <em>good mood.</em></h1>
        <p>Ordering live from Table ${String(state.tableNo).padStart(2,'0')} — add items below to send straight to POS & Kitchen.</p>
      </section>
      <div class="customer-content">
        <h2>Our menu</h2>
        <div class="category-row">
          ${cats.map(c => `<button class="${state.category===c?'selected':''}" onclick="state.category='${c}';render()">${c}</button>`).join('')}
        </div>
        <div class="customer-menu-grid">
          ${items.map(p => `
            <article class="customer-product">
              <img src="${p.image}" alt="${p.name}" />
              <div class="customer-product-info">
                <span>${p.category}</span>
                <h3>${p.name}</h3>
                <p>${p.description}</p>
                <div>
                  <b>Rs. ${fmtPKR(p.price)}</b>
                  <button onclick="changeQty(${p.id}, 1)">＋</button>
                </div>
                ${state.cart[p.id] ? `
                  <div class="qty-control">
                    <button onclick="changeQty(${p.id}, -1)">−</button>
                    <b>${state.cart[p.id]}</b>
                    <button onclick="changeQty(${p.id}, 1)">＋</button>
                  </div>
                ` : ''}
              </div>
            </article>
          `).join('')}
        </div>
      </div>
      ${count > 0 ? `
        <div class="cart-bar">
          <span>🛍 ${count} items · Rs. ${fmtPKR(total)}</span>
          <button onclick="state.checkoutOpen=true;render()">Checkout →</button>
        </div>
      ` : ''}
      ${state.checkoutOpen ? `
        <div style="position:fixed;inset:0;background:#350b1dcc;z-index:70;display:grid;place-items:center;padding:15px">
          <section class="panel" style="width:min(460px,100%);max-height:90vh;overflow:auto">
            <h2>Complete your order</h2>
            <p>Table ${String(state.tableNo).padStart(2,'0')} · ${count} items · <b>Rs. ${fmtPKR(total)}</b></p>
            <label class="form-label">Name<input class="form-input" value="${state.guestName}" oninput="state.guestName=this.value" placeholder="Your name"/></label>
            <label class="form-label">Phone (optional)<input class="form-input" value="${state.guestPhone}" oninput="state.guestPhone=this.value" placeholder="03xx-xxxxxxx"/></label>
            <label class="form-label">Special instructions<textarea class="form-input" oninput="state.guestNote=this.value" placeholder="Less spicy, no onion...">${state.guestNote}</textarea></label>
            <label class="form-label">Payment method
              <select class="form-input" onchange="state.guestMethod=this.value;render()">
                <option value="cash" ${state.guestMethod==='cash'?'selected':''}>Cash at counter</option>
                <option value="jazzcash" ${state.guestMethod==='jazzcash'?'selected':''}>JazzCash (verification required)</option>
                <option value="easypaisa" ${state.guestMethod==='easypaisa'?'selected':''}>Easypaisa (verification required)</option>
                <option value="raast" ${state.guestMethod==='raast'?'selected':''}>Raast / Bank transfer</option>
              </select>
            </label>
            <button class="button primary full" onclick="submitCustomerOrder()">Confirm order · Rs. ${fmtPKR(total)}</button>
            <button class="button secondary full" onclick="state.checkoutOpen=false;render()">Back to menu</button>
          </section>
        </div>
      ` : ''}
      <footer class="customer-footer">Powered by <b>Velvet CafeOS</b></footer>
    </main>
  `;
}

function renderPOS() {
  const statuses = ['New','Accepted','Preparing','Ready','Served','Completed','Cancelled'];
  return `
    <main class="page-content">
      <div class="page-heading">
        <div><div class="eyebrow">FRONT OF HOUSE</div><h2>Cashier POS</h2><p>Live orders submitted from Customer Menus — update status, confirm payment, or print receipt.</p></div>
        <div class="welcome-actions">
          <button class="button secondary" onclick="setView('dashboard')">← Main Dashboard</button>
          <button class="button primary" onclick="setView('customer', 1)">＋ Place Table 01 Order</button>
        </div>
      </div>
      <div class="panel">
        <div class="table-wrap">
          <table>
            <thead><tr><th>ORDER</th><th>TABLE / GUEST</th><th>ITEMS</th><th>TOTAL</th><th>PAYMENT</th><th>STATUS</th><th>ACTION</th></tr></thead>
            <tbody>
              ${state.orders.map(o => `
                <tr>
                  <td><b>${o.id}</b><span class="sub-cell">${new Date(o.createdAt).toLocaleTimeString()}</span></td>
                  <td><span class="table-chip">Table ${String(o.table).padStart(2,'0')}</span><span class="sub-cell">${o.customer||''}</span></td>
                  <td>${o.items.map(i => i.qty + '× ' + i.name).join(', ')}${o.note ? `<span class="sub-cell">Note: ${o.note}</span>` : ''}</td>
                  <td><b>Rs. ${fmtPKR(o.total)}</b></td>
                  <td><b style="text-transform:uppercase">${o.method}</b><span class="sub-cell">${o.paymentStatus}</span></td>
                  <td><span class="table-chip">${o.status}</span></td>
                  <td>
                    <select class="form-input" style="min-width:125px;padding:6px 8px;margin:0" onchange="updateOrderStatus('${o.id}', this.value)">
                      ${statuses.map(s => `<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
                    </select>
                    <div style="display:flex;gap:10px;margin-top:6px">
                      ${o.paymentStatus !== 'Paid' ? `<button class="text-button" onclick="markOrderPaid('${o.id}')">✓ Confirm payment</button>` : ''}
                      <button class="text-button" onclick="window.print()">🖨 Print</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </main>
  `;
}

function renderKitchen() {
  const cols = [
    { title: 'New / Accepted', match: ['New','Accepted'], next: 'Preparing', btn: 'Accept & prepare' },
    { title: 'Preparing', match: ['Preparing'], next: 'Ready', btn: 'Mark as ready' },
    { title: 'Ready to serve', match: ['Ready'], next: 'Served', btn: 'Complete & serve' }
  ];
  return `
    <div class="app-shell">
      ${renderSidebar()}
      <main class="main-area">
        ${renderTopbar('Kitchen display', 'Keep every order moving smoothly')}
        <div class="page-content">
          <div class="page-heading"><div><h2>Kitchen queue</h2><p>Live kitchen workflow</p></div><span class="live-pill">● LIVE KITCHEN</span></div>
          <div class="kitchen-grid">
            ${cols.map(col => {
              const list = state.orders.filter(o => col.match.includes(o.status));
              return `
                <section class="kitchen-column">
                  <div class="kitchen-col-head"><b>${col.title}</b><span>${list.length}</span></div>
                  ${list.map(o => `
                    <article class="kitchen-card">
                      <div class="kitchen-card-top"><b>${o.id}</b><span>Table ${String(o.table).padStart(2,'0')}</span></div>
                      <p>${o.items.map(i => i.qty + '× ' + i.name).join(', ')}</p>
                      ${o.note ? `<p style="color:#6c1438;font-weight:700">Note: ${o.note}</p>` : ''}
                      <small>Placed at ${new Date(o.createdAt).toLocaleTimeString()}</small>
                      <button class="button primary full" onclick="updateOrderStatus('${o.id}', '${col.next}')">${col.btn}</button>
                    </article>
                  `).join('') || `<p style="text-align:center;color:#887b7c;font-size:11px;padding:24px">No orders in queue</p>`}
                </section>
              `;
            }).join('')}
          </div>
        </div>
      </main>
    </div>
  `;
}

function renderOwner() {
  const valid = state.orders.filter(o => o.status !== 'Cancelled');
  const rev = valid.reduce((s,o) => s + Number(o.total||0), 0);
  const active = new Set(valid.filter(o => !['Served','Completed'].includes(o.status)).map(o => o.table)).size;
  return `
    <main class="page-content">
      <div class="page-heading">
        <div><div class="eyebrow">OWNER CONTROL CENTRE</div><h2>Velvet Cafe & Grill overview</h2><p>Mobile-friendly daily operations snapshot.</p></div>
        <div class="welcome-actions"><button class="button secondary" onclick="setView('dashboard')">← Main Dashboard</button><span class="live-pill">● LIVE</span></div>
      </div>
      <div class="stats-grid">
        <article class="stat-card"><div class="stat-top">Recorded sales<span class="stat-icon green">₨</span></div><h3>Rs. ${fmtPKR(rev)}</h3><div class="stat-foot">Live session orders</div></article>
        <article class="stat-card"><div class="stat-top">Total orders<span class="stat-icon green">🛍</span></div><h3>${valid.length}</h3><div class="stat-foot">Live session orders</div></article>
        <article class="stat-card"><div class="stat-top">Average order<span class="stat-icon green">✦</span></div><h3>Rs. ${fmtPKR(valid.length ? Math.round(rev/valid.length) : 0)}</h3><div class="stat-foot">Per table ticket</div></article>
        <article class="stat-card"><div class="stat-top">Active tables<span class="stat-icon green">🪑</span></div><h3>${String(active).padStart(2,'0')} / 15</h3><div class="stat-foot">Currently dining</div></article>
      </div>
      <div class="panel">
        <h3 style="margin-top:0">Recent orders</h3>
        <div class="table-wrap">
          <table><thead><tr><th>ORDER</th><th>TABLE</th><th>ITEMS</th><th>TIME</th><th>AMOUNT</th><th>STATUS</th></tr></thead>
          <tbody>
            ${state.orders.map(o => `<tr><td><b>${o.id}</b></td><td>Table ${String(o.table).padStart(2,'0')}</td><td>${o.items.map(i=>i.qty+'× '+i.name).join(', ')}</td><td>${new Date(o.createdAt).toLocaleTimeString()}</td><td><b>Rs. ${fmtPKR(o.total)}</b></td><td><span class="table-chip">${o.status}</span></td></tr>`).join('')}
          </tbody></table>
        </div>
      </div>
    </main>
  `;
}

function renderTables() {
  const occupied = new Set(state.orders.filter(o => !['Served','Completed','Cancelled'].includes(o.status)).map(o => Number(o.table)));
  return `
    <div class="app-shell">
      ${renderSidebar()}
      <main class="main-area">
        ${renderTopbar('Tables & QR codes', '15 live table entry points')}
        <div class="page-content">
          <div class="page-heading"><div><h2>Table management</h2><p>Click any table card or QR image to open that table’s live Customer Menu.</p></div></div>
          <div class="table-grid">
            ${Array.from({length:15}, (_,i) => {
              const n = i + 1;
              const isOcc = occupied.has(n);
              return `
                <article class="table-card">
                  <div class="table-card-top"><span class="table-state ${isOcc?'occupied':'available'}">${isOcc?'Occupied':'Available'}</span><span>▣</span></div>
                  <h3>Table ${String(n).padStart(2,'0')}</h3>
                  <p>${i%3===0?4:i%3===1?2:6} seats</p>
                  <img src="${QR_URIS[n]}" alt="Table ${n} QR" onclick="setView('customer', ${n})" style="cursor:pointer;display:block;width:130px;height:158px;object-fit:contain;margin:8px auto" />
                  <button class="text-button" onclick="setView('customer', ${n})">Open Table ${String(n).padStart(2,'0')} menu →</button>
                  <a class="text-button" href="${QR_URIS[n]}" download="velvet-table-${String(n).padStart(2,'0')}.png">Download QR PNG ↓</a>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      </main>
    </div>
  `;
}

function renderMenuMgmt() {
  return `
    <div class="app-shell">
      ${renderSidebar()}
      <main class="main-area">
        ${renderTopbar('Menu management', 'Manage the products customers can order')}
        <div class="page-content">
          <div class="page-heading"><div><h2>Your menu <span class="count-badge">${MENU_ITEMS.length} items</span></h2><p>Luxury Cafe & Grill menu items.</p></div><button class="button primary" onclick="setView('customer', 1)">Preview Customer Menu →</button></div>
          <div class="menu-grid">
            ${MENU_ITEMS.map(item => `<article class="menu-card"><img src="${item.image}" alt="${item.name}"/><div><span class="category-tag">${item.category}</span><h3>${item.name}</h3><p>${item.description}</p><b>Rs. ${fmtPKR(item.price)}</b></div></article>`).join('')}
          </div>
        </div>
      </main>
    </div>
  `;
}

function renderOrdersPage() {
  return `
    <div class="app-shell">
      ${renderSidebar()}
      <main class="main-area">
        ${renderTopbar('Orders', 'Track, manage and fulfil customer orders')}
        <div class="page-content">
          <div class="page-heading"><div><h2>All orders</h2><p>Click a status badge to advance the order.</p></div><button class="button primary" onclick="setView('customer', 1)">＋ Create order</button></div>
          <section class="panel orders-panel"><div class="table-wrap"><table><thead><tr><th>ORDER ID</th><th>TABLE</th><th>ORDER DETAILS</th><th>AMOUNT</th><th>PAYMENT</th><th>STATUS</th><th></th></tr></thead><tbody>${renderOrderRows()}</tbody></table></div></section>
        </div>
      </main>
    </div>
  `;
}

function renderSettings() {
  return `
    <div class="app-shell">
      ${renderSidebar()}
      <main class="main-area">
        ${renderTopbar('Settings', 'Configure your cafe workspace')}
        <div class="page-content">
          <div class="settings-grid">
            <section class="panel settings-panel"><h3>Business profile</h3><label>Cafe name<input value="Velvet Cafe & Grill" readonly/></label><label>Currency<input value="PKR — Pakistani Rupee" readonly/></label><label>Timezone<input value="Asia/Karachi" readonly/></label></section>
            <section class="panel settings-panel"><h3>Standalone & Cloud Ready</h3><p>This interactive suite runs 100% standalone in any browser with zero server timeouts, and your full Next.js 15 source code is ready in Velvet-Cafe-Grill-Complete.zip for permanent Vercel deployment.</p><span class="live-pill">✓ Ready to use & deploy</span></section>
          </div>
        </div>
      </main>
    </div>
  `;
}

function render() {
  let body = '';
  if (state.view === 'dashboard') body = renderDashboard();
  else if (state.view === 'customer') body = renderCustomer();
  else if (state.view === 'pos') body = renderPOS();
  else if (state.view === 'kitchen') body = renderKitchen();
  else if (state.view === 'owner') body = renderOwner();
  else if (state.view === 'tables') body = renderTables();
  else if (state.view === 'menu') body = renderMenuMgmt();
  else if (state.view === 'orders') body = renderOrdersPage();
  else body = renderSettings();

  document.getElementById('app').innerHTML = renderTopLiveBar() + body;
}

render();
</script>
</body>
</html>
